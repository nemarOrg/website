name: Release

# Fires when a release version lands on `main` — i.e. right after a
# `git push origin origin/staging:main` promotion of a branch that
# `prepare-release.yml` has already stripped to a clean `X.Y.Z`.
#
# This job never writes to `main`. It only:
#
#   1. Tags `vX.Y.Z` and cuts a GitHub Release.
#   2. Merges `main` back into `staging` and bumps it to <next-patch>-dev0,
#      so staging never reuses a released number and `main` stays an ancestor
#      of `staging` (which is what keeps promotion a fast-forward forever).
#
# ---------------------------------------------------------------------------
# Why there is no version rewrite here
#
# nemar-cli's auto-tag.yml strips the `-devN` suffix on main and pushes the
# result. That is impossible here: the `keep-main` ruleset requires lint,
# typecheck, test, and build on every commit pushed to `main`, with no bypass
# actors, and a newly created strip commit cannot have them. The strip
# therefore happens on `staging` in `prepare-release.yml`, before promotion —
# see that file's header for the full reasoning.
#
# Pushing to `staging` is unrestricted; the ruleset scopes to
# `~DEFAULT_BRANCH` only. Note that it reports as 404 through the classic
# `/branches/main/protection` API — read `/repos/{o}/{r}/rulesets` instead.
#
# Pushes made with GITHUB_TOKEN do not start workflow runs, so the sync push
# below dispatches CI and Deploy staging explicitly. CI matters most: without
# it the next promotion would be rejected for missing checks.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.head_commit.author.email != 'nemar-bot@users.noreply.github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Configure git identity
        run: |
          git config user.name "nemar-bot"
          git config user.email "nemar-bot@users.noreply.github.com"

      - name: Resolve version
        id: final
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A `-dev` version on main means someone promoted without running
          # prepare-release.yml. Don't tag it — a `v0.2.0-dev7` tag and
          # release would be noise that has to be cleaned up by hand.
          if [[ "$VERSION" == *-dev* ]]; then
            echo "::error::main is on $VERSION. Promotion happened without prepare-release.yml, so there is nothing to tag. Run 'Prepare release' on staging and promote again."
            exit 1
          fi

          # Anything else with a `-` (rc/alpha/beta) is a deliberate
          # pre-release and gets tagged as one.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $VERSION"

      - name: Create tag
        id: tag
        run: |
          TAG="v${{ steps.final.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists (re-run on an already-released commit). Skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tagged $TAG"

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.final.outputs.version }}"
          ARGS=("$TAG" --title "$TAG" --generate-notes)
          if [ "${{ steps.final.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "${ARGS[@]}"
          echo "Released $TAG"

      - name: Open the next dev cycle on staging
        id: sync
        # Only after a tag was actually created. A re-run on an
        # already-released commit would otherwise bump staging again and
        # silently skip a version number.
        #
        # The inverse risk — tagging succeeds, this fails, and a re-run now
        # declines to sync — is the safer failure: an unsynced staging stops
        # being a fast-forward of main, so the next promotion fails loudly
        # rather than drifting quietly.
        if: steps.tag.outputs.created == 'true'
        run: |
          # Explicit refspec: this job checked out `main`, so `origin/staging`
          # existing at all is a side effect of fetch-depth: 0. Naming it
          # makes the dependency visible and survives a future depth change.
          git fetch origin +refs/heads/staging:refs/remotes/origin/staging
          git checkout -B staging origin/staging

          # After a fast-forward promotion staging is an ancestor of main, so
          # this is itself a fast-forward and cannot conflict. It only gets
          # interesting when a PR landed on staging *during* this run.
          if ! git merge --no-ff origin/main -m "chore: sync staging with main after v${{ steps.final.outputs.version }}"; then
            UNMERGED=$(git diff --name-only --diff-filter=U)
            if [ "$UNMERGED" != "package.json" ]; then
              git merge --abort
              echo "::error::Merging main into staging conflicted outside package.json:"
              echo "$UNMERGED"
              echo "::error::Resolve by hand; staging was left untouched."
              exit 1
            fi
            # Take main's released version as the base. Not arbitrary: the
            # bump below computes from whatever is here, and bumping dev0 from
            # a stale -devN would regress the version (0.2.0-dev7 -> 0.2.0-dev0)
            # instead of advancing it (0.2.0 -> 0.2.1-dev0).
            git checkout --theirs package.json
            git add package.json
            git commit --no-edit
            echo "::notice::Resolved a package.json conflict in favour of the released version."
          fi

          ./scripts/bump-version.sh dev0
          git push origin staging
          echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI and deploy for the synced staging branch
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The push above used GITHUB_TOKEN and so triggers nothing on its
          # own. CI is the one that must run: the next promotion is rejected
          # unless the tip of staging carries the four required checks.
          gh workflow run "CI" --ref staging
          gh workflow run "Deploy staging" --ref staging

      - name: Summary
        run: |
          {
            echo "### Released v${{ steps.final.outputs.version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`v${{ steps.final.outputs.version }}\` |"
            echo "| Prerelease | ${{ steps.final.outputs.prerelease }} |"
            echo "| main | \`${{ steps.final.outputs.version }}\` |"
            echo "| staging | \`${{ steps.sync.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
