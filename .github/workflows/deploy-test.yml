name: Deploy staging

# Deploys `test.nemar.org` — a separate Cloudflare Pages project
# (`nemar-website-test`) wired to the nemar-cli staging APIs
# (api-test/data-test/zarr-test.nemar.org). The prod `nemar-website` project
# deploys via Cloudflare's GitHub integration and is untouched by this file.
#
# Owner setup (one-time, not done by this workflow) — all done:
#   1. [x] Repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (SCCN
#          account; narrow Pages:Edit token) added 2026-07-20; pushes to
#          `staging` deploy automatically.
#   Done during epic #923 Phase 7 (2026-07-18):
#   2. [x] `staging` branch created.
#   3. [x] `nemar-website-test` Pages project created (SCCN account).
#   4. [x] `test.nemar.org` attached, with a proxied CNAME to
#          nemar-website-test.pages.dev.
#   5. [x] SESSION_SECRET set on nemar-website-test (distinct from prod's).
#
# Known limitation: ORCID sign-in may not work on staging (the ORCID sandbox
# callback for test.nemar.org may not be registered). Use email-code login
# instead; the backend's `dev_code` response field covers staging without an
# inbox (see nemar-cli AGENTS.md "Web-Dashboard Auth").

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (staging env)
        env:
          NEMAR_SKIP_OG_GENERATE: "1"
          PUBLIC_API_BASE_URL: https://api-test.nemar.org
          PUBLIC_DATA_BASE_URL: https://data-test.nemar.org
          PUBLIC_ZARR_BASE_URL: https://zarr-test.nemar.org
        run: bun run build
      # `wrangler pages deploy` rejects a custom config path outright ("Pages
      # does not support custom paths for the Wrangler configuration file"), so
      # `-c wrangler.test.toml` fails the job. Swap the staging config into
      # place as wrangler.toml instead, which keeps the original intent (the
      # test project must never pick up the prod wrangler.toml vars) and works.
      # Safe because the CI checkout is throwaway.
      - name: Use the staging wrangler config
        run: mv wrangler.test.toml wrangler.toml
      - name: Deploy to nemar-website-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          bunx wrangler pages deploy dist
          --project-name nemar-website-test
          --branch main
