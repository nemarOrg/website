name: Deploy staging

# Deploys `test.nemar.org` — a separate Cloudflare Pages project
# (`nemar-website-test`) wired to the nemar-cli staging APIs
# (api-test/data-test/zarr-test.nemar.org). The prod `nemar-website` project
# deploys via Cloudflare's GitHub integration and is untouched by this file.
#
# Owner setup (one-time, not done by this workflow):
#   1. Add repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (SCCN
#      account; Pages:Edit scope).
#   2. Create the `staging` branch.
#   3. Create the `nemar-website-test` Pages project (SCCN account).
#   4. Attach the `test.nemar.org` custom domain to that project.
#   5. Set a SESSION_SECRET on nemar-website-test (dashboard or
#      `wrangler pages secret put SESSION_SECRET -c wrangler.test.toml`) —
#      it must NOT reuse prod's secret.
#
# Known limitation: ORCID sign-in may not work on staging (the ORCID sandbox
# callback for test.nemar.org may not be registered). Use email-code login
# instead; the backend's `dev_code` response field covers staging without an
# inbox (see nemar-cli AGENTS.md "Web-Dashboard Auth").

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (staging env)
        env:
          NEMAR_SKIP_OG_GENERATE: "1"
          PUBLIC_API_BASE_URL: https://api-test.nemar.org
          PUBLIC_DATA_BASE_URL: https://data-test.nemar.org
          PUBLIC_ZARR_BASE_URL: https://zarr-test.nemar.org
        run: bun run build
      - name: Deploy to nemar-website-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          bunx wrangler pages deploy dist
          --project-name nemar-website-test
          --branch main
          -c wrangler.test.toml
