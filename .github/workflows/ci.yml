name: CI

# Runs on `staging` as well as `main`, and that is load-bearing rather than
# nice-to-have. The `keep-main` repository ruleset requires lint/typecheck/
# test from this file, plus the `Cloudflare Pages` check, to be green *on the
# commit being pushed* to `main`. Promotion is a fast-forward of `staging`, so
# whatever sits at the tip of `staging` must already carry those checks or the
# promotion is rejected outright.
#
# There is no build job here. Cloudflare's GitHub integration builds every push
# (production on `main`, a preview on any other branch) and reports the
# `Cloudflare Pages` check, which `keep-main` requires in place of a build job
# of our own (2026-11-19). It reports on bot-pushed commits too, since it is
# started by Cloudflare's webhook and not by a GitHub Actions trigger.
#
# Before website#214 this file only ran on `pull_request` and `push: main`,
# which meant no commit on `staging` ever had them. Promotions still worked by
# accident: pushing to `main` triggered this workflow, which attached the
# checks retroactively, and the ruleset evidently evaluated the push before
# they were required. The first bot-authored commit on `staging` broke that
# accident and the promotion was rejected with "4 of 4 required status checks
# are expected".
#
# Note the ruleset reports as 404 through the classic
# `/branches/main/protection` API — check `/repos/{o}/{r}/rulesets` instead.

on:
  push:
    branches: [main, staging]
  pull_request:
  # Dispatchable so `auto-bump-staging.yml` can request a run on its own bump
  # commit. That commit is pushed with GITHUB_TOKEN, and GitHub does not start
  # workflow runs from such pushes — without an explicit dispatch the commit
  # would carry no checks at all.
  workflow_dispatch:

# Cancel in-flight runs for the same ref so pushes get fast feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run lint

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Astro check
        run: bun run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Without this, test/account-copy-drift.test.ts finds no nemar-cli
      # checkout beside it and used to log-and-pass, so CI enforced no
      # parity at all between this repo's account copy and nemar-cli's
      # contract. No token needed; both repos are public.
      #
      # REF PAIRING: always nemar-cli `dev`, never `main`, whatever this PR
      # targets. The pre-release branches are the coupled pair — this repo's
      # `staging` and nemar-cli's `dev` carry a copy change together — and
      # `main` on either side is only a snapshot of them taken at the last
      # release.
      #
      # Pinning `main` for a main-targeted PR, as this step did until #315,
      # DEADLOCKS every coordinated release that touches the copy, and does so
      # symmetrically: our release PR compares staging copy against nemar-cli's
      # not-yet-promoted `main`, while nemar-cli's release PR compares its new
      # contract against OUR not-yet-promoted `main`. Both go red, and neither
      # can merge to give the other what it wants. Observed on the v0.2.8 /
      # nemar-cli v0.9.16 release of epic nemarOrg/nemar-cli#1250, the first
      # release after the gate landed (website#314, nemar-cli#1276).
      #
      # Comparing against `dev` keeps the gate non-vacuous: every copy change
      # lands on `staging` or `dev` through a PR, and that PR is checked
      # against the counterpart's live pre-release branch. A promotion PR
      # re-checks the exact pair about to ship together.
      #
      # See nemar-cli ADR 0046.
      #
      # The same sparse checkout now serves a SECOND drift test,
      # test/docs-auth-contract-drift.test.ts, against
      # shared/contract/docs-auth.ts. Everything above applies to it unchanged:
      # same repo, same `dev` ref pairing, same reason. Adding a path to the
      # sparse-checkout list is the whole cost of covering another contract.
      # test/private-site-contract-drift.test.ts is the third, against
      # shared/contract/private-site.ts.
      # test/publication-review-copy-drift.test.ts is a FOURTH, against
      # shared/contract/publication-review-copy.ts; same `dev` pairing.
      # The same test also compares the page's numbers with shared/publication-limits.ts, which
      # sits beside the contract directory; without it that test skips, visibly.
      # test/validator-pin-drift.test.ts is a FIFTH, against validator-version.json at the root of
      # nemar-cli: the release of the BIDS validator that the CLI, the repository check and the
      # upload page all run. Same `dev` pairing. When nemar-cli moves the pin, this job fails until
      # this repo's copy and the vendored validator follow (ADR 0028).
      # test/mail-admin-contract-drift.test.ts is a SIXTH, against shared/contract/mail-admin.ts: the
      # closed lists the admin Mail tab branches on. Same `dev` pairing, and strict like the rest, so
      # it is red until the file reaches nemar-cli `dev`.
      # test/oidc-authorize-contract-drift.test.ts is a SEVENTH, against
      # shared/contract/oidc-authorize.ts (the authorization endpoint's routes, answer kinds, codes
      # and reasons) and shared/oidc.ts beside it (the page's path). Same `dev` pairing, and strict.
      # test/mail-categories-drift.test.ts is an EIGHTH, against shared/contract/mail-categories.ts
      # (the community mail categories the Settings card and the unsubscribe page read). Same `dev`
      # pairing, and strict (nemar-cli epic #2260 reached `dev` in PR #2293). The same test also reads
      # backend/src/services/mail-links.ts (NEMAR_CLI_MAIL_LINKS) to compare the unsubscribe
      # token pattern with the backend's TOKEN_RE.
      # test/compute-terms-contract-drift.test.ts is a NINTH, against shared/contract/compute-terms.ts:
      # the compute terms version a request must name (website ADR 0030, interim until phase D2's
      # GET /compute/me serves it). Same `dev` pairing, strict, and red until the compute epic
      # reaches nemar-cli `dev`; the ref stays `dev`.
      # test/compute-user-contract-drift.test.ts is a TENTH, against shared/compute-state.ts and
      # shared/contract/compute-user.ts and compute.ts: the job states, front doors, usage groups,
      # page bounds and read-refusal words the /compute page branches on (phase E2). Same `dev`
      # pairing, strict, and red until the compute epic reaches nemar-cli `dev`.
      # test/compute-admin-contract-drift.test.ts is an ELEVENTH: the compute state machine, the decision
      # words and the bounds the admin Compute tab branches on (compute-access-state.ts,
      # compute-state.ts, contract/compute-access.ts, contract/compute-admin.ts). Same `dev` pairing,
      # and strict: red on a phase PR until the compute epic reaches nemar-cli `dev`. It also holds the
      # decision dialog's notice rule (COMPUTE_ACCESS_NOTICE_RULE, its words, bound and function
      # bodies) to contract/compute-access.ts text for text.
      # test/compute-job-contract-drift.test.ts is a TWELFTH, against shared/compute-state.ts,
      # shared/contract/compute-submit.ts and compute-responses.ts: the failure codes, the refusal
      # statuses, the truncated-log header, the bounds and the cancel outcomes the job page
      # (phase E3) branches on. Same `dev` pairing, strict, and red until the compute epic reaches
      # nemar-cli `dev`.
      # test/compute-pipeline-contract-drift.test.ts is a THIRTEENTH, against contract/compute-admin.ts
      # (the pipeline grid's words, bounds and patterns), shared/compute-recipes.ts (the checkpoint
      # names), contract/compute-runner.ts, contract/compute.ts and contract/compute-progress.ts (the
      # admin Pipelines tab, nemar-cli ADR 0134 phase 4b). It reuses NEMAR_CLI_COMPUTE_ADMIN_CONTRACT
      # and reads the others beside it. Strict, and red until nemar-cli epic #2324 reaches `dev`; the
      # dependency is one-directional, so nemar-cli `dev` merges first and website `staging` second.
      # test/quality-views-vocabulary-drift.test.ts is a FOURTEENTH, against
      # shared/contract/neuroschema/views/SHA256SUMS.json (the neuroschema view vocabulary nemar-cli
      # vendors; nemar-cli ADR 0137, website ADR 0035) and the registry beside it: the copies in
      # src/lib/quality-views/vocabulary/ and test/fixtures/quality-views/vectors/ must carry the
      # digests it lists. Same `dev` pairing, strict, and red until nemar-cli epic #2324 reaches `dev`.
      # test/quality-route-contract-drift.test.ts is a FIFTEENTH, against shared/contract/quality-route.ts
      # (the public quality route's paths, words and bounds the dataset page's panel reads; website
      # phase W6), imported as a module with its two imports, compute-naming.ts and compute-stamp.ts.
      # Same `dev` pairing, strict, and red until nemar-cli epic #2324 reaches `dev`.
      - uses: actions/checkout@v4
        with:
          repository: nemarOrg/nemar-cli
          path: nemar-cli-contract
          sparse-checkout: |
            /backend/src/services/mail-links.ts
            /shared/compute-access-state.ts
            /shared/compute-naming.ts
            /shared/compute-recipes.ts
            /shared/compute-state.ts
            /shared/contract/account-copy.ts
            /shared/contract/compute-access.ts
            /shared/contract/compute-admin.ts
            /shared/contract/compute-progress.ts
            /shared/contract/compute-responses.ts
            /shared/contract/compute-runner.ts
            /shared/contract/compute-stamp.ts
            /shared/contract/compute-submit.ts
            /shared/contract/compute-terms.ts
            /shared/contract/compute-user.ts
            /shared/contract/compute.ts
            /shared/contract/docs-auth.ts
            /shared/contract/mail-admin.ts
            /shared/contract/mail-categories.ts
            /shared/contract/neuroschema/views/SHA256SUMS.json
            /shared/contract/neuroschema/views/registry.json
            /shared/contract/neuroschema/views/montages/
            /shared/contract/oidc-authorize.ts
            /shared/contract/private-site.ts
            /shared/contract/publication-review-copy.ts
            /shared/contract/quality-route.ts
            /shared/oidc.ts
            /shared/publication-limits.ts
            /validator-version.json
          sparse-checkout-cone-mode: false
          ref: dev
      - name: Vitest
        run: bun run test
        env:
          NEMAR_CLI_ACCOUNT_COPY: nemar-cli-contract/shared/contract/account-copy.ts
          NEMAR_CLI_COMPUTE_ACCESS_CONTRACT: nemar-cli-contract/shared/contract/compute-terms.ts
          NEMAR_CLI_COMPUTE_CONTRACT: nemar-cli-contract/shared/contract/compute.ts
          NEMAR_CLI_COMPUTE_RESPONSES_CONTRACT: nemar-cli-contract/shared/contract/compute-responses.ts
          NEMAR_CLI_COMPUTE_SUBMIT_CONTRACT: nemar-cli-contract/shared/contract/compute-submit.ts
          NEMAR_CLI_COMPUTE_STATE: nemar-cli-contract/shared/compute-state.ts
          NEMAR_CLI_COMPUTE_USER_CONTRACT: nemar-cli-contract/shared/contract/compute-user.ts
          NEMAR_CLI_COMPUTE_ADMIN_CONTRACT: nemar-cli-contract/shared/contract/compute-admin.ts
          NEMAR_CLI_DOCS_CONTRACT: nemar-cli-contract/shared/contract/docs-auth.ts
          NEMAR_CLI_MAIL_ADMIN_CONTRACT: nemar-cli-contract/shared/contract/mail-admin.ts
          NEMAR_CLI_MAIL_CATEGORIES: nemar-cli-contract/shared/contract/mail-categories.ts
          NEMAR_CLI_MAIL_LINKS: nemar-cli-contract/backend/src/services/mail-links.ts
          NEMAR_CLI_OIDC_AUTHORIZE_CONTRACT: nemar-cli-contract/shared/contract/oidc-authorize.ts
          NEMAR_CLI_PRIVATE_SITE_CONTRACT: nemar-cli-contract/shared/contract/private-site.ts
          NEMAR_CLI_QUALITY_ROUTE: nemar-cli-contract/shared/contract/quality-route.ts
          NEMAR_CLI_QUALITY_VIEWS: nemar-cli-contract/shared/contract/neuroschema/views/SHA256SUMS.json
          NEMAR_CLI_REVIEW_COPY: nemar-cli-contract/shared/contract/publication-review-copy.ts
          NEMAR_CLI_VALIDATOR_PIN: nemar-cli-contract/validator-version.json
      # The quality views' budgets (nemar-cli ADR 0137, website ADR 0035 decision 1), each a step of
      # its own after Vitest. `!cancelled()` runs them even when Vitest failed: on the epic's PRs
      # the drift tests are red until nemar-cli `dev` catches up, and the budgets must still be
      # checked.
      # The drawing budget runs alone on this runner, which stands in for the mid-range laptop:
      # the first maps of a view within 50 ms, a 128-sensor view of 128 maps within 100 ms and a
      # 256-sensor one within 300 ms (test/quality-views-perf.test.ts), as a median of five views and
      # for the first view a page meets, cold (warmed while its values download) and eager (cached
      # data at mount) (website#592).
      - name: Quality-view drawing budget
        if: ${{ !cancelled() }}
        run: bun run test:quality-views-perf
      # The size budget is checked after a real build: the sensor-field worker at most 12 KB gzipped
      # and the main-thread code at most 30 KB, measured in dist/ from each lazily imported chunk
      # that reaches the client (the signal viewer imports it), and on the site's own Vite building
      # the client as an entry (scripts/check-quality-views-size.mjs). `astro build` alone takes seconds; the OG images
      # of `bun run build` are not needed for it.
      - name: Site build
        if: ${{ !cancelled() }}
        run: bunx astro build
      - name: Quality-view bundle sizes
        if: ${{ !cancelled() }}
        run: bun scripts/check-quality-views-size.mjs --require-build
