name: CI

# Runs on `staging` as well as `main`, and that is load-bearing rather than
# nice-to-have. The `keep-main` repository ruleset requires lint/typecheck/
# test/build to be green *on the commit being pushed* to `main`. Promotion is
# a fast-forward of `staging`, so whatever sits at the tip of `staging` must
# already carry those four checks or the promotion is rejected outright.
#
# Before website#214 this file only ran on `pull_request` and `push: main`,
# which meant no commit on `staging` ever had them. Promotions still worked by
# accident: pushing to `main` triggered this workflow, which attached the
# checks retroactively, and the ruleset evidently evaluated the push before
# they were required. The first bot-authored commit on `staging` broke that
# accident and the promotion was rejected with "4 of 4 required status checks
# are expected".
#
# Note the ruleset reports as 404 through the classic
# `/branches/main/protection` API — check `/repos/{o}/{r}/rulesets` instead.

on:
  push:
    branches: [main, staging]
  pull_request:
  # Dispatchable so `auto-bump-staging.yml` can request a run on its own bump
  # commit. That commit is pushed with GITHUB_TOKEN, and GitHub does not start
  # workflow runs from such pushes — without an explicit dispatch the commit
  # would carry no checks at all.
  workflow_dispatch:

# Cancel in-flight runs for the same ref so pushes get fast feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run lint

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Astro check
        run: bun run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Without this, test/account-copy-drift.test.ts finds no nemar-cli
      # checkout beside it and used to log-and-pass, so CI enforced no
      # parity at all between this repo's account copy and nemar-cli's
      # contract. staging pairs with nemar-cli's dev branch, main with
      # nemar-cli's main. No token needed; both repos are public.
      - uses: actions/checkout@v4
        with:
          repository: nemarOrg/nemar-cli
          path: nemar-cli-contract
          sparse-checkout: shared/contract/account-copy.ts
          sparse-checkout-cone-mode: false
          ref: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'main' || 'dev' }}
      - name: Vitest
        run: bun run test
        env:
          NEMAR_CLI_ACCOUNT_COPY: nemar-cli-contract/shared/contract/account-copy.ts

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
