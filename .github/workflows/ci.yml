name: CI

# Runs on `staging` as well as `main`, and that is load-bearing rather than
# nice-to-have. The `keep-main` repository ruleset requires lint/typecheck/
# test/build to be green *on the commit being pushed* to `main`. Promotion is
# a fast-forward of `staging`, so whatever sits at the tip of `staging` must
# already carry those four checks or the promotion is rejected outright.
#
# Before website#214 this file only ran on `pull_request` and `push: main`,
# which meant no commit on `staging` ever had them. Promotions still worked by
# accident: pushing to `main` triggered this workflow, which attached the
# checks retroactively, and the ruleset evidently evaluated the push before
# they were required. The first bot-authored commit on `staging` broke that
# accident and the promotion was rejected with "4 of 4 required status checks
# are expected".
#
# Note the ruleset reports as 404 through the classic
# `/branches/main/protection` API — check `/repos/{o}/{r}/rulesets` instead.

on:
  push:
    branches: [main, staging]
  pull_request:
  # Dispatchable so `auto-bump-staging.yml` can request a run on its own bump
  # commit. That commit is pushed with GITHUB_TOKEN, and GitHub does not start
  # workflow runs from such pushes — without an explicit dispatch the commit
  # would carry no checks at all.
  workflow_dispatch:

# Cancel in-flight runs for the same ref so pushes get fast feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run lint

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Astro check
        run: bun run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Without this, test/account-copy-drift.test.ts finds no nemar-cli
      # checkout beside it and used to log-and-pass, so CI enforced no
      # parity at all between this repo's account copy and nemar-cli's
      # contract. No token needed; both repos are public.
      #
      # REF PAIRING: always nemar-cli `dev`, never `main`, whatever this PR
      # targets. The pre-release branches are the coupled pair — this repo's
      # `staging` and nemar-cli's `dev` carry a copy change together — and
      # `main` on either side is only a snapshot of them taken at the last
      # release.
      #
      # Pinning `main` for a main-targeted PR, as this step did until #315,
      # DEADLOCKS every coordinated release that touches the copy, and does so
      # symmetrically: our release PR compares staging copy against nemar-cli's
      # not-yet-promoted `main`, while nemar-cli's release PR compares its new
      # contract against OUR not-yet-promoted `main`. Both go red, and neither
      # can merge to give the other what it wants. Observed on the v0.2.8 /
      # nemar-cli v0.9.16 release of epic nemarOrg/nemar-cli#1250, the first
      # release after the gate landed (website#314, nemar-cli#1276).
      #
      # Comparing against `dev` keeps the gate non-vacuous: every copy change
      # lands on `staging` or `dev` through a PR, and that PR is checked
      # against the counterpart's live pre-release branch. A promotion PR
      # re-checks the exact pair about to ship together.
      #
      # See nemar-cli ADR 0046.
      - uses: actions/checkout@v4
        with:
          repository: nemarOrg/nemar-cli
          path: nemar-cli-contract
          sparse-checkout: /shared/contract/account-copy.ts
          sparse-checkout-cone-mode: false
          ref: dev
      - name: Vitest
        run: bun run test
        env:
          NEMAR_CLI_ACCOUNT_COPY: nemar-cli-contract/shared/contract/account-copy.ts

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
